  <text x="58" y="35" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="0.02em">透明创作 · 版权归我</text>
