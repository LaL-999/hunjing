# 2026-06-24:加 build-system —— 生产用 `pip install -e backend` 部署必需。
# 缺它时 setuptools flat-layout 会同时发现 app/ 和 tests/ 两个顶层包而报
# "Multiple top-level packages discovered" 装不上 → 后端起不来。
# [tool.setuptools] 显式只打包 app/(排除 tests/)。本机 uv 工作流不受影响
# (uv 读 [tool.uv] package=false,pip 读 [build-system],各走各的)。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "huimeng-backend"
version = "0.1.0"
description = "浑晶 (HunJing) backend — MVP 阶段 1(纯邮箱 OTP + SQLite + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic[email]>=2.6",          # EmailStr 校验
    "python-jose[cryptography]>=3.3", # JWT
    "openai>=1.30",                   # 复用 simulate.py 风格,refine 服务用
    "python-multipart>=0.0.9",        # FastAPI multipart 上传(Sprint 2.A)
    "ebooklib>=0.18",                 # .epub 解析(Sprint 2.A)
    "python-docx>=1.1",               # .docx 解析(Sprint 2.A)
    "beautifulsoup4>=4.12",           # epub 内嵌 HTML 抽纯文本(配合 ebooklib)
    "Pillow>=10.0,<12.0",             # Sprint 4.C 漫画排版 _agent_typesetter(PIL 本地合成对话气泡 / 旁白 / 拟声词)
    "requests>=2.31",                 # Sprint 4.C 下载 Seedream 远程 panel 图(BytesIO);simulation 已用过未列入,显式补
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.26",                    # FastAPI TestClient
]
# 2026-06-02 上线监控 — 生产环境装,本地开发可选
# 安装:pip install -e ".[monitoring]"  或直接 pip install "sentry-sdk[fastapi]>=2.0"
# 接入文档:docs/monitoring.md
monitoring = [
    "sentry-sdk[fastapi]>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
