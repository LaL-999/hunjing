# 浑晶 nginx 配置 — 三子域(门户 / 在线创作 / 后端 API)
# 放到 /etc/nginx/sites-available/huimeng.conf,再 ln -s 到 sites-enabled。
# HTTPS(443 + 证书 + http→https 跳转)由 certbot --nginx 自动补,先用这份 80 的,
# 跑完 certbot 后它会自动改写本文件加上 443 段。
#
# 目录约定(setup.sh 会建好):
#   门户:    /opt/huimeng/app/portal
#   前端 dist:/opt/huimeng/app/frontend/dist
#   后端:    127.0.0.1:8000(systemd 起的 uvicorn)

# 后端上游 + keepalive 连接池(SPA 大量小请求复用 TCP,省握手 / 防端口耗尽)
upstream huimeng_backend {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ---------- 门户(根域 + www)----------
server {
    listen 80;
    listen [::]:80;
    server_name shuangdayeye.cn www.shuangdayeye.cn;

    root /opt/huimeng/app/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/huimeng-portal.access.log;
}

# ---------- 在线创作平台(Vue SPA)----------
server {
    listen 80;
    listen [::]:80;
    server_name app.shuangdayeye.cn;

    root /opt/huimeng/app/frontend/dist;
    index index.html;

    # gzip 压缩 JS/CSS/JSON/SVG —— 那个 1.4MB 的 3D 图谱包能压到 ~375KB,首屏快很多
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml font/woff2;

    # Vue Router history 模式:找不到文件回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存(带 hash 文件名,安全)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/huimeng-app.access.log;
}

# ---------- 后端 API ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.shuangdayeye.cn;

    # 上传 epub/docx 可能较大;后端默认上限 100MB,这里留余量到 110M,
    # 让后端返回结构化错误而非 nginx 裸 413
    client_max_body_size 110M;

    # API 是 JSON,gzip 压缩响应(减小传输,提速)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types application/json text/plain;

    location / {
        proxy_pass http://huimeng_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # 配合 upstream keepalive(默认会发 close,必须清空)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 调用可能较慢,放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 🔴 SSE / 流式必须关缓冲 —— 否则 nginx 把整条 event-stream 缓存住,
        # 前端(抽取进度 / AI 续写实时进度)永远收不到事件。
        proxy_buffering off;
        proxy_cache off;
    }

    access_log /var/log/nginx/huimeng-api.access.log;
}
