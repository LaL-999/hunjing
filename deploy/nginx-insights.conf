# 浑晶洞察后台 nginx 配置 —— 独立子域 insights.shuangdayeye.cn
#
# 放到 /etc/nginx/sites-available/huimeng-insights.conf,再 ln -s 到 sites-enabled。
# HTTPS(443 + 证书)由 certbot --nginx 自动补(把 insights 子域一起列进证书命令)。
#
# 安全模型(关键):
#   - 整站套 HTTP Basic Auth(admin/agent/health/SPA 静态全覆盖)——
#     因为洞察接口只有一把会被 build 进公开 bundle 的 token,等于无鉴权,
#     必须用 nginx 这道正交的墙挡住外网。/admin/users 能导出全平台用户 PII。
#   - 唯独 /track 与 /track/batch 放行匿名公网(平台埋点必须能匿名 POST),
#     但加 limit_req 限流 + client_max_body_size 收紧,防刷库 / payload 放大。
#
# 目录约定:
#   insights 前端 dist:/opt/huimeng/app/insights-frontend/dist
#   insights 后端:    127.0.0.1:8001(systemd huimeng-insights)

# 洞察后端上游
upstream insights_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# 埋点限流区(按来源 IP):20 req/s,突发 40。http 上下文,需放 server{} 之外。
# 注:若主 conf 已定义同名 zone 会 nginx -t 报重复 —— 改个 zone 名即可。
limit_req_zone $binary_remote_addr zone=insights_track:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name insights.shuangdayeye.cn;

    root /opt/huimeng/app/insights-frontend/dist;
    index index.html;

    # ---- 整站 Basic Auth(下方 /track* 单独关掉)----
    auth_basic           "Huimeng Insights";
    auth_basic_user_file /etc/nginx/.htpasswd-insights;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml font/woff2;

    # ========== 公开埋点(匿名可达,关 Basic Auth,加限流 + payload 上限)==========
    # 精确匹配,优先级高于下方 SPA fallback。平台前端从 app 子域跨域 POST 到这里。
    location = /track {
        auth_basic off;
        limit_req zone=insights_track burst=40 nodelay;
        client_max_body_size 32k;
        proxy_pass http://insights_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /track/batch {
        auth_basic off;
        limit_req zone=insights_track burst=40 nodelay;
        client_max_body_size 64k;   # batch 多条,给到 64k
        proxy_pass http://insights_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 洞察 API(admin / agent / track/health),走 Basic Auth ==========
    location ~ ^/(admin|agent)/ {
        proxy_pass http://insights_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # agent/run-* 跑 LLM,给足超时 + 关缓冲
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    location = /track/health {
        proxy_pass http://insights_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== SPA 静态 + history fallback(Basic Auth 生效)==========
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/huimeng-insights.access.log;
}
